<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost & Found — Messages</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/chat.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar__brand">Lost &amp; <span>Found</span></div>
    <div class="navbar__spacer"></div>
    <div class="navbar__actions">
      <div id="userInfo"></div>
      <a href="/dashboard.html" class="btn btn--outline btn--sm">📋 Items</a>
      <a id="adminLink" href="/admin.html" class="btn btn--outline btn--sm" style="display:none;">⚙️ Admin</a>
      <button id="logoutBtn" class="btn btn--danger btn--sm">Sign Out</button>
    </div>
  </nav>

  <div class="chat-layout">

    <!-- Sidebar: Conversations -->
    <aside class="chat-sidebar">
      <div class="chat-sidebar__header">
        <span class="chat-sidebar__title">💬 Messages</span>
        <span id="onlineDot" class="online-indicator">● Connected</span>
      </div>
      <div id="convList" class="conv-list">
        <div class="loading-state" style="padding:30px"><span class="spinner"></span></div>
      </div>
    </aside>

    <!-- Main: Chat Window -->
    <main class="chat-main">
      <!-- Empty state -->
      <div id="chatEmpty" class="chat-empty">
        <div class="chat-empty__icon">💬</div>
        <h3>Your Messages</h3>
        <p>Select a conversation or start one from an item's detail view.</p>
      </div>

      <!-- Active chat -->
      <div id="chatWindow" class="chat-window" style="display:none;">
        <div class="chat-window__header" id="chatHeader">
          <div class="chat-header-info">
            <div class="chat-avatar" id="chatAvatar">?</div>
            <div>
              <div class="chat-header-name" id="chatName">—</div>
              <div class="chat-header-sub" id="chatSub"></div>
            </div>
          </div>
          <div id="typingIndicator" class="typing-indicator" style="display:none;">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="chat-messages" id="chatMessages">
          <div class="loading-state"><span class="spinner spinner--lg"></span></div>
        </div>

        <div class="chat-input-bar">
          <textarea
            id="msgInput"
            class="chat-input"
            placeholder="Type a message…"
            rows="1"
            maxlength="1000"
          ></textarea>
          <button id="sendBtn" class="btn btn--primary chat-send-btn">Send</button>
        </div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
